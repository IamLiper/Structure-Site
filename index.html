<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Surpresa Romântica ❤️</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- FONTES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

  <!-- HERO -->
  <section class="hero">

    <h1 id="coupleName"></h1>

    <p id="surpriseText"></p>

    <button class="btn" id="surpriseBtn">
      Clique para descobrir ❤️
    </button>

  </section>

  <!-- CONTADOR -->
  <section id="contador" class="hidden">

    <h2 class="title">
      Nosso Tempo Juntos ⏳
    </h2>

    <div class="contador">

      <div class="box">
        <h3 id="dias">0</h3>
        <span>Dias</span>
      </div>

      <div class="box">
        <h3 id="horas">0</h3>
        <span>Horas</span>
      </div>

      <div class="box">
        <h3 id="minutos">0</h3>
        <span>Minutos</span>
      </div>

      <div class="box">
        <h3 id="segundos">0</h3>
        <span>Segundos</span>
      </div>

    </div>

  </section>

  <!-- GALERIA -->
  <section class="hidden">

    <h2 class="title">
      Nossos Momentos 📸
    </h2>

    <div class="gallery"></div>

  </section>

  <!-- TEXTO -->
  <section class="hidden">

    <h2 class="title">
      Uma mensagem pra você 💌
    </h2>

    <div class="texto" id="message"></div>

    <button class="btn music-btn" onclick="playMusic()">
      🎵 Tocar nossa música
    </button>

    <audio id="music"></audio>

  </section>

  <!-- FINAL -->
  <footer class="hidden">

    <h2>
      Para sempre nós ❤️
    </h2>

    <p>
      Feito com amor especialmente para você.
    </p>

    <button class="btn" onclick="explosion()">
      Clique aqui ❤️
    </button>

  </footer>

  <!-- CONFIG -->
  <script src="config/config.js"></script>

  <!-- SCRIPT -->
  <script src="script.js"></script>

</body>

</html>
